name = "tenant-dd"
main = "worker.js"
compatibility_date = "2026-10-01"

# Public (non-secret) vars
[vars]
APP_NAME = "Tenant Management - DD"
CARD_PREFIX = "TNT"
# Default card validity in days when landlord does not set one
DEFAULT_VALID_DAYS = "365"
# Signed vault/photo link lifetime (seconds)
VAULT_LINK_TTL = "300"
# Public URL of this worker (used inside QR codes). Set after first deploy.
BASE_URL = "https://tenant-dd.ertahirhussainofficial.workers.dev"
# App update check (shown inside the app when APP_VERSION is higher than the installed one)
APP_VERSION = "2"
APK_URL = ""
APP_NOTES = ""

# Secrets — set with:  wrangler secret put NAME
#   FB_DB_URL       https://tenantcard-xxxx-default-rtdb.asia-southeast1.firebasedatabase.app
#   FB_SECRET       Firebase > Project settings > Service accounts > Database secrets
#   HMAC_SECRET     long random string (QR token signing)
#   JWT_SECRET      long random string (app login tokens)
#   ADMIN_KEY       long random string (super-admin key for curl; app uses Firebase email login instead)
#   FB_API_KEY      Firebase > Project settings > General > "Web API Key" (needed for super-admin email login)
#   ADMIN_EMAILS    optional, comma-separated: only these Firebase Auth emails may log in as super-admin
#   TG_BOT_TOKEN    from @BotFather
#   TG_CHAT_ID      private channel id, e.g. -1001234567890 (bot must be admin)
